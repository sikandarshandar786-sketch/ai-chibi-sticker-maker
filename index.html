<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5b8d">
<title>AI Chibi Sticker Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff7fb;color:#222}
.wrap{max-width:520px;margin:auto;padding:18px}.hero{text-align:center;padding:10px 4px 18px}
h1{margin:5px 0 6px;font-size:29px}.sub{margin:0;color:#666}
.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:16px;box-shadow:0 8px 28px #0000000d;margin-bottom:14px}
.drop{border:2px dashed #ff7ba5;border-radius:18px;padding:22px;text-align:center;background:#fff9fb;cursor:pointer}
input[type=file]{display:none}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:16px;margin-top:12px;display:none}
label{display:block;font-weight:700;margin:12px 0 7px}select,input[type=text]{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;background:#ff5b8d;color:#fff;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}.secondary{background:#222}.hint{font-size:13px;color:#777;margin-top:8px}.status{padding:12px;border-radius:12px;background:#f5f5f5;margin-top:12px;display:none}
.result{width:100%;border-radius:18px;display:none;margin-top:12px}.tiny{font-size:12px;color:#888;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>✨ AI Chibi Sticker Maker</h1>
    <p class="sub">Turn your photo into a cute sticker</p>
  </div>

  <div class="card">
    <label for="photo" class="drop">📷 Tap to upload a photo<input id="photo" type="file" accept="image/*"></label>
    <img id="preview" class="preview" alt="Photo preview">
    <label>Sticker text</label>
    <input id="caption" type="text" value="My Happy Family" maxlength="60">
    <label>Style</label>
    <select id="style">
      <option>Chibi sticker — thick white border</option>
      <option>Kawaii chibi</option>
      <option>Family sticker</option>
    </select>
    <button id="make" disabled>✨ Create Chibi Sticker</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <img id="result" class="result" alt="Generated sticker">
    <button id="save" class="secondary" style="display:none">⬇️ Save Sticker</button>
    <button id="share" class="secondary" style="display:none">📤 Share</button>
  </div>

  <p class="tiny">Free to use • More features and ads can be added later</p>
</div>

<script>
const photo=document.getElementById('photo'), preview=document.getElementById('preview');
const make=document.getElementById('make'), status=document.getElementById('status');
const result=document.getElementById('result'), save=document.getElementById('save'), share=document.getElementById('share');
let selectedFile=null, resultUrl=null;

photo.onchange=()=>{
  selectedFile=photo.files[0];
  if(!selectedFile) return;
  preview.src=URL.createObjectURL(selectedFile); preview.style.display='block'; make.disabled=false;
};
function msg(t){status.textContent=t;status.style.display='block'}

make.onclick=async()=>{
  if(!selectedFile) return;
  make.disabled=true; msg('Creating your chibi sticker…');
  const fd=new FormData();
  fd.append('image',selectedFile);
  fd.append('caption',document.getElementById('caption').value);
  fd.append('style',document.getElementById('style').value);
  try{
    const r=await fetch(https://ai-chibi-sticker-maker.onrender.com/generate

    if(!r.ok) throw new Error(await r.text());
    const blob=await r.blob();
    if(resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl=URL.createObjectURL(blob);
    result.src=resultUrl; result.style.display='block';
    save.style.display='block'; share.style.display='block';
    msg('Done! Your sticker is ready.');
  }catch(e){
    msg('The AI service is not connected yet. Deploy the backend and set your OpenAI API key.');
  }finally{make.disabled=false}
};
save.onclick=()=>{
  if(!resultUrl)return;
  const a=document.createElement('a');a.href=resultUrl;a.download='chibi-sticker.png';a.click();
};
share.onclick=async()=>{
  if(!resultUrl)return;
  try{
    const blob=await fetch(resultUrl).then(r=>r.blob());
    const file=new File([blob],'chibi-sticker.png',{type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]}))
      await navigator.share({title:'My Chibi Sticker',files:[file]});
    else save.click();
  }catch(e){}
};
</script>
</body>
</html>
